name: Release SonarGG

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SonarGG.csproj

      - name: Build SonarGG in Release Mode
        run: dotnet publish SonarGG.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Create Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath publish/SonarGG-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/SonarGG.exe
            publish/SonarGG-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
